[package]
name = "dynamic-config-etcd"
description = "Read dynamic-config configuration from an etcd v3 key/value store."
readme = "README.md"
version.workspace = true
edition.workspace = true
# Higher than the core crate's 1.71: a gRPC stack moves faster than this crate
# wants to. The core stays where it is; a companion pays for what it pulls in.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dynamic-config-etcd"
authors.workspace = true
categories.workspace = true
keywords.workspace = true
exclude.workspace = true

[features]
default = []
# TLS to etcd, through `tonic`'s rustls. `tls-roots` also trusts the platform's
# root store, which is what a public CA needs.
tls = ["etcd-client/tls"]
# `tls` too: roots without a TLS stack to hand them to would be a feature
# that compiles and connects to nothing.
tls-roots = ["tls", "etcd-client/tls-roots"]

[dependencies]
# etcd v3 speaks gRPC, so its client is async — which is why this crate
# implements the async trait rather than the blocking one.
dynamic-config = { workspace = true, features = ["async"] }
dynamic-config-store-core = { workspace = true }
etcd-client = "0.19"
# `time` as well as `sync`: etcd's own `ConnectOptions::with_timeout` bounds
# connecting, so a per-fetch deadline has to be a `tokio::time::timeout`
# around the request itself.
tokio = { version = "1.47", features = ["sync", "time"] }

[dev-dependencies]
dynamic-config = { workspace = true, features = ["async", "json"] }
testcontainers = "0.27"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0.221", features = ["derive"] }

# The mTLS example names `Etcd::with_tls`, which is behind `tls` — without
# this it would fail to build under `--no-default-features --all-targets`,
# which is half of what `just lint` checks.
[[example]]
name = "etcd_client_certificate"
required-features = ["tls"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
