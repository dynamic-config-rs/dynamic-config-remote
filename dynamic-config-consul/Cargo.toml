[package]
name = "dynamic-config-consul"
description = "Read dynamic-config configuration from Consul's key/value store."
readme = "README.md"
version.workspace = true
edition.workspace = true
# Higher than the core crate's 1.71, and unavoidably so: an HTTP client stack
# and a container-driving test harness both move faster than this crate wants
# to. The core stays where it is; a companion pays for what it pulls in.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dynamic-config-consul"
authors.workspace = true
categories.workspace = true
keywords.workspace = true
exclude.workspace = true

[dependencies]
dynamic-config = { workspace = true }
dynamic-config-store-core = { workspace = true }
ureq = { version = "3.0.12", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.127"
base64 = "0.23"

[dev-dependencies]
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.15", features = ["consul"] }
# A self-signed certificate authority, generated in the test. TLS is the one
# feature whose tests cannot use a fixture: a certificate expires, and a
# committed one turns into a suite that fails on a date nobody chose. Dev-only,
# so it is in no build a user of this crate produces.
rcgen = "0.14"

serde = { version = "1.0.221", features = ["derive"] }
dynamic-config = { workspace = true, features = ["json"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
