name: Scorecard

# OpenSSF Scorecard: the repository's own supply-chain posture — branch
# protection, token permissions, pinned dependencies, dangerous workflow
# patterns — scored and uploaded to code scanning, where a regression shows
# up as an alert rather than a surprise.
#
# Runs on `main` because Scorecard only publishes results from the *default*
# branch, and `main` is it. The schedule keeps the score honest when the
# repository is quiet. A re-run of an old run replays its frozen event
# payload — after a default-branch change, dispatch a fresh run instead.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: supply-chain posture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # SARIF upload into code scanning.
      security-events: write
      # Signed publishing to the OpenSSF REST API (the public badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@05b42c624433fc40578a4040d5cf5e36ddca8cde # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - uses: github/codeql-action/upload-sarif@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          sarif_file: results.sarif
