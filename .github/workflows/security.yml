name: Security

# Advisories are published on someone else's schedule, so this runs on one of
# its own as well as on every change. A dependency that was clean on Monday is
# not necessarily clean on Friday, and nothing about this repository has to
# change for that to happen.
# No push trigger for `dev` — same reasoning as ci.yml: dev travels through
# pull requests, and a push twin under required checks poisons the gate.
on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# A push during a run makes the older run's answer obsolete.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: the security policy names the current line
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The stale-table drift this org has already lived through once:
      # SECURITY.md said 0.0.x while the workspace shipped 0.7. The table's
      # top row must name the line that is actually published.
      - run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          line="${version%.*}.x"
          if ! grep -qF "| ${line}" SECURITY.md; then
            echo "::error file=SECURITY.md::the supported-versions table does not name ${line} (workspace is ${version})"
            exit 1
          fi
          echo "SECURITY.md names ${line} — current"

  # deny, the unsafe sweep and dependency review are the org's shared
  # definition — the 75%-identical file every Rust repo carried, defined
  # once. This repository is the migration pilot; `@main` becomes `@v1`
  # when the .github repository is first tagged.
  shared:
    # The caller's grant must COVER every permission a called job asks
    # for — the callee's dependency review comments on pull requests,
    # and a callee cannot exceed what this block hands it. Leaving it
    # off inherits the workflow's bare `contents: read` and fails the
    # whole call at startup.
    permissions:
      contents: read
      pull-requests: write
    uses: dynamic-config-rs/.github/.github/workflows/reusable-security-rust.yml@main
    with:
      crates: >-
        dynamic-config-store-core dynamic-config-etcd dynamic-config-consul
        dynamic-config-nats dynamic-config-vault dynamic-config-redis
        dynamic-config-s3 dynamic-config-firestore dynamic-config-git
      bins: dynamic-config-server

  # The one status branch protection requires from this workflow — same
  # reasoning as CI's gate. The dependency review inside `shared` only
  # exists on pull requests; a skipped inner job does not fail the
  # called workflow, so a plain push passes while a PR with a failing
  # review is blocked — which is the whole point of running it.
  security-ok:
    name: Security is green
    needs: [policy, shared]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
