# Mention-based: write `@claude <ask>` in an issue, a PR comment or a review
# and it answers in context — explain this failure, fix this, review this
# diff, open a PR for that. Only mentions from users with write access
# trigger anything; the action enforces that itself.
#
# Auth is a Claude subscription, not API credit: run `claude setup-token`
# locally and store the result as the `CLAUDE_CODE_OAUTH_TOKEN` repository
# secret.
#
# The model comes from the `CLAUDE_MODEL` repository *variable*
# (Settings → Secrets and variables → Actions → Variables), so switching to
# e.g. `claude-opus-5` is a settings change, not a commit. Unset, it falls
# back to Sonnet.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    # `assigned` is inert under the `if` below — assigning someone doesn't
    # put `@claude` in the body or title. Kept only so adding an
    # assignment-based trigger later is a one-line change.
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: >
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        # The token rides in `env` as well as `with`: subscription OAuth
        # tokens intermittently fail to reach the Claude subprocess through
        # the input alone (anthropics/claude-code-action#1281, #676) — the
        # run dies in seconds with `is_error: true` and no message.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # No prompt: tag mode. The action reads the mention, the thread and
          # the diff, and answers or acts in place. Repository rules reach it
          # through AGENTS.md, the same way they reach every other agent.
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
            --allowedTools "Bash(cargo build:*),Bash(cargo check:*),Bash(cargo test:*),Bash(cargo clippy:*),Bash(cargo fmt:*),Bash(gh pr:*),Bash(gh issue:*)"

      # DIAGNOSTICS, kept commented for the next bare `is_error: true`
      # (anthropics/claude-code-action#1281 and friends). Uncomment both,
      # trigger with a harmless mention — not a real task, they print to the
      # public Actions log — and read `api_error_status` / `result`, which
      # is where the cause finally has a name. The shape check goes *before*
      # the action step, the dump *after* it.
      #
      # - name: Token shape check
      #   # Prints only the fixed `sk-ant-oat01` prefix (zero entropy) and a
      #   # length. Do not widen the substring: GitHub masks secrets by exact
      #   # match, so a longer slice would print unmasked.
      #   env:
      #     T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      #   run: |
      #     echo "length: ${#T}"
      #     echo "prefix: ${T:0:12}"
      #     case "$T" in *[[:space:]]*) echo "!! contains whitespace/newline" ;; esac
      #     echo "--- anthropic env vars (names only) ---"
      #     env | grep -i anthropic | cut -d= -f1 || echo "(none)"
      #
      # - name: Dump Claude result
      #   if: always()
      #   run: |
      #     f=/home/runner/work/_temp/claude-execution-output.json
      #     [ -f "$f" ] || { echo "no output file — died before the SDK started"; exit 0; }
      #     jq -r '(if type=="array" then .[] else . end)
      #            | select(.type=="result")
