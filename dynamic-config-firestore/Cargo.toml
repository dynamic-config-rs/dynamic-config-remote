[package]
name = "dynamic-config-firestore"
description = "Read dynamic-config configuration from a Google Cloud Firestore document."
readme = "README.md"
version.workspace = true
edition.workspace = true
# Higher than the core crate's 1.71: an HTTP client stack and a
# container-driving test harness both move faster than this crate wants to.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dynamic-config-firestore"
authors.workspace = true
categories = ["config", "api-bindings"]
keywords = ["config", "firestore", "gcp", "hot-reload", "watch"]
exclude.workspace = true

[dependencies]
# Firestore's REST API is plain HTTP, so this implements the blocking trait:
# nothing here needs an async runtime, and neither does using it.
dynamic-config = { workspace = true }
dynamic-config-store-core = { workspace = true }
ureq = { version = "3.0.12", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0.127"

[dev-dependencies]
dynamic-config = { workspace = true, features = ["json"] }
testcontainers = { version = "0.27", features = ["blocking"] }
# A self-signed certificate authority, generated in the test. TLS is the one
# feature whose tests cannot use a fixture: a certificate expires, and a
# committed one turns into a suite that fails on a date nobody chose. Dev-only,
# so it is in no build a user of this crate produces.
rcgen = "0.14"

serde = { version = "1.0.221", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
