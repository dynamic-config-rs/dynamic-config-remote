[graph]
all-features = true

[advisories]
yanked = "deny"
# Exceptions are listed one at a time, with a reason, and never as a blanket
# "ignore dev-dependencies": a vulnerability in something that runs on a
# contributor's machine or in CI still matters.
ignore = [
    # `paste` is unmaintained rather than vulnerable — an informational
    # advisory. It arrives through `actix-web`, which is a dev-dependency of
    # one example, so it is in no build a user of this crate produces. Revisit
    # if it ever becomes a vulnerability, or if actix drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained, not vulnerable; dev-only, via actix-web in an example" },
    # `bincode 1.x` and `proc-macro-error2` are unmaintained rather than
    # vulnerable — informational advisories again. Both arrive through
    # `iai-callgrind`, the instruction-count harness, which is a
    # dev-dependency of the core crate: `cargo tree -i` shows one path each
    # and it ends at `benches/instructions.rs`. Nothing a user of this crate
    # builds contains either. The harness is worth the two entries because
    # instruction counts are the only performance gate a shared runner can
    # actually hold; revisit if either advisory becomes a vulnerability, or
    # when iai-callgrind moves to `bincode 2`. There is a second reason to
    # keep watching it: cargo already reports `proc-macro-error2` as code a
    # future Rust will reject (`cargo report future-incompatibilities`), so
    # this dependency has an expiry date whatever RustSec says about it.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained, not vulnerable; dev-only, via iai-callgrind in a bench" },
    { id = "RUSTSEC-2026-0173", reason = "unmaintained, not vulnerable; dev-only, via iai-callgrind-macros in a bench" },
    # The two `lru` advisories (an aliasing violation in `IterMut`, a
    # panic-safety use-after-free in `pop()`) are accepted on the GitHub
    # Dependabot tab with written reasons, not here: RustSec's copies either
    # do not exist yet (2026-0253) or no longer match lru 0.12 as its
    # criteria stand (2026-0002), and cargo-deny treats an ignore that
    # matches nothing as noise at best and a failure at worst. The exposure
    # itself is upstream-blocked — `aws-sdk-s3` pins `^0.12.2` — and neither
    # vulnerable code path occurs in the SDK's identity-cache usage. Re-add
    # entries here if RustSec ships criteria that match.
]
# `time` is pinned in Cargo.lock to 0.3.47 or newer (RUSTSEC-2026-0009), which
# declares rust-version 1.88. That is fine — it is reached only through the
# companion crates and dev-dependencies, never through the core crate, whose
# floor is 1.71. Regenerating the lockfile with
# `resolver.incompatible-rust-versions = "fallback"` will silently drop it back
# to 0.3.41 and reintroduce the advisory, so re-apply
# `cargo update -p time --precise <patched>` afterwards.

[licenses]
# Permissive only. A copyleft dependency would leak into every user of a crate
# that is meant to be uncontroversial to add.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Not copyleft, despite the name: a public-domain dedication, which is
    # strictly more permissive than MIT. `notify` uses it.
    "CC0-1.0",
    # The Mozilla CA root store, as data. Permissive, and reached through every
    # TLS stack in the companion crates.
    "CDLA-Permissive-2.0",
    # Permissive, OSI-approved, and no attribution requirement for binaries.
    # Reached through `xxhash-rust`, which the Redis client uses for hashing.
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# `serde_yaml 0.9` is archived by its author (the version literally reads
# `0.9.34+deprecated`). It stays for now: figment's own `yaml` feature pulls
# it regardless, so switching our direct dependency would not remove it from
# the tree — tracked as an issue until figment moves.
